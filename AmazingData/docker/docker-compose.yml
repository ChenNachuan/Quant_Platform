version: '3.8'

services:
  amazingdata:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: amazingdata-mcp-server
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      - USER=${USER}
      - PASSWORD=${PASSWORD}
      - HOST=${HOST}
      - PORT=${PORT}
    restart: unless-stopped
