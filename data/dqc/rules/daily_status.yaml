# DQC rules — daily_status (cn_stock_daily_status)

rules:
  # ---- Completeness ----
  - id: C01
    name: row_count_vs_calendar
    severity: HARD
    type: custom_check
    function: "checks.custom_checks.check_row_count_vs_calendar"
    params:
      comparison: "eq"
    applicability: [daily, fund]
    threshold: "deduplicated trade_date count == calendar trading day count"
    threshold_source: fixed
    boundary: "eq: both sides must match exactly; one extra or one missing date fails"
    description: "Row count must equal calendar trading days"

  - id: C02
    name: row_count_vs_universe
    severity: SOFT
    type: custom_check
    function: "checks.custom_checks.check_row_count_vs_universe"
    params:
      min_ratio: 0.95
    applicability: [daily, fund]
    threshold: "single-day ticker count >= universe 95%"
    threshold_source: statistical
    boundary: "ge 0.95: ratio exactly 0.95 passes, 0.9499 fails"
    description: "Daily ticker coverage vs universe"

  - id: C14
    name: daily_status_nullable_rate
    severity: SOFT
    type: custom_check
    function: "checks.custom_checks.check_daily_status_nullable_rate"
    params:
      max_null_rate: 0.01
      columns: [pre_close, up_limit, down_limit, limit_pct]
    applicability: [daily]
    threshold: "non-suspended limit fields null rate <= 1%"
    threshold_source: statistical
    boundary: "le 0.01: null rate at 1% passes, above fails"
    description: "Daily status nullable price/limit rate for active stocks"

  - id: C11
    name: row_count_vs_prev_day
    severity: SOFT
    type: custom_check
    function: "checks.custom_checks.row_count_vs_prev_day"
    params:
      min_ratio: 0.9
      max_ratio: 1.1
    applicability: [daily]
    threshold: "today row count / prev row count in [0.9, 1.1]"
    threshold_source: statistical
    boundary: "inclusive [0.9, 1.1]: ratio outside [0.9, 1.1] flags batch"
    description: "Cross-day row count ratio vs previous trading day"

  - id: C12
    name: ticker_set_drift
    severity: SOFT
    type: custom_check
    function: "checks.custom_checks.ticker_set_drift"
    params:
      max_new_rate: 0.05
      max_drop_rate: 0.02
    applicability: [daily]
    threshold: "new ticker rate <= 5% AND dropped ticker rate <= 2%"
    threshold_source: statistical
    boundary: "le: new_rate > 0.05 or drop_rate > 0.02 flags batch"
    description: "Cross-day ticker set drift vs previous trading day"

  # ---- Legality ----
  - id: L13
    name: ticker_format
    severity: HARD
    type: column_check
    columns: [ticker]
    condition: "regex"
    value: "^([036]\\d{5}\\.(SH|SZ)|(43|83|87|92)\\d{4}\\.BJ)$"
    applicability: [daily, minute, fund, factor, reference]
    threshold: "regex ^([036]\\d{5}\\.(SH|SZ)|(43|83|87|92)\\d{4}\\.BJ)$"
    threshold_source: fixed
    boundary: "full regex match: partial match or mismatch fails"
    description: "Ticker format validation"

  - id: L14
    name: date_format
    severity: HARD
    type: column_check
    columns: [trade_date]
    condition: "date_format"
    value: "ISO8601"
    applicability: [daily, minute, fund, factor, reference]
    threshold: "ISO 8601 date format"
    threshold_source: fixed
    boundary: "valid ISO 8601 date: non-parseable dates fail"
    description: "Date format must be ISO 8601"

  - id: L18
    name: non_negative_nullable
    severity: HARD
    type: custom_check
    function: "checks.custom_checks.check_non_negative_nullable"
    params: {}
    applicability: [daily, reference]
    threshold: "non-null numeric values satisfy schema positive/non_negative and finite checks"
    threshold_source: fixed
    boundary: "ge 0 or gt 0 per schema: negative or inf fails, 0 passes for non_negative"
    description: "Nullable numeric positivity and non-negativity validation"

  - id: L27
    name: daily_status_boolean_flags
    severity: HARD
    type: column_check
    columns: [is_st, is_suspend, is_limit_up, is_limit_down, touched_limit_up, touched_limit_down, is_xr]
    condition: "isbool_notnull"
    value: null
    applicability: [daily]
    threshold: "all 7 daily_status bool flags are bool with no nulls"
    threshold_source: fixed
    boundary: "dtype bool + notnull: any null or non-bool value fails"
    description: "Daily status boolean flags validation"

  # ---- Consistency ----
  - id: K15
    name: daily_status_consistency
    severity: HARD
    type: custom_check
    function: "checks.custom_checks.check_daily_status_consistency"
    params: {}
    applicability: [daily]
    threshold: "up_limit >= down_limit, limit implies touched, not both limit_up/down, suspend not limited"
    threshold_source: fixed
    boundary: "inclusive: up_limit == down_limit passes; contradictory limit/suspend flags fail"
    description: "Daily status limit and suspension consistency"

  # ---- Timeliness ----
  - id: T01
    name: daily_freshness
    severity: HARD
    type: custom_check
    function: "checks.custom_checks.check_daily_freshness"
    params:
      max_stale_days: 1
    applicability: [daily, fund]
    threshold: "latest trade_date within 1 trading day of now"
    threshold_source: fixed
    boundary: "le 1: exactly 1 trading day stale passes, 2 fails"
    description: "Daily data freshness"

  - id: T03
    name: no_future_dates
    severity: HARD
    type: custom_check
    function: "checks.custom_checks.check_no_future_dates"
    params: {}
    applicability: [daily, minute, fund, factor, reference]
    threshold: "all trade_date <= today"
    threshold_source: fixed
    boundary: "le today: today PASSES, any future date FAILS"
    description: "No future dates"

  - id: T04
    name: date_ascending
    severity: HARD
    type: custom_check
    function: "checks.custom_checks.check_date_ascending"
    params: {}
    applicability: [daily, minute, fund]
    threshold: "strictly ascending with no duplicates within partition"
    threshold_source: fixed
    boundary: "strictly increasing: equal consecutive dates (duplicates) FAIL"
    description: "Dates must be strictly ascending with no duplicates"

  - id: T09
    name: late_correction
    severity: SOFT
    type: custom_check
    function: "checks.custom_checks.check_late_correction"
    params:
      max_change_rate: 0.0001
    applicability: [daily, fund]
    threshold: "historical change > 0.01% triggers alert"
    threshold_source: statistical
    boundary: "gt 0.0001: change rate at exactly 0.01% does NOT trigger, above triggers"
    description: "Late correction detection for historical data"
