# DQC rules — index_bars_daily (cn_stock_index_bars_daily)

rules:
  # ---- Completeness ----
  - id: C01
    name: row_count_vs_calendar
    severity: HARD
    type: custom_check
    function: "checks.custom_checks.check_row_count_vs_calendar"
    params:
      comparison: "eq"
    applicability: [daily, fund]
    threshold: "deduplicated trade_date count == calendar trading day count"
    threshold_source: fixed
    boundary: "eq: both sides must match exactly; one extra or one missing date fails"
    description: "Row count must equal calendar trading days"

  - id: C02
    name: row_count_vs_universe
    severity: SOFT
    type: custom_check
    function: "checks.custom_checks.check_row_count_vs_universe"
    params:
      min_ratio: 0.95
    applicability: [daily, fund]
    threshold: "single-day ticker count >= universe 95%"
    threshold_source: statistical
    boundary: "ge 0.95: ratio exactly 0.95 passes, 0.9499 fails"
    description: "Daily ticker coverage vs universe"

  - id: C04
    name: null_critical_fields
    severity: HARD
    type: column_check
    columns: [open, high, low, close, volume]
    condition: "notnull"
    value: null
    applicability: [daily, minute]
    threshold: "non-suspended OHLCV has zero nulls"
    threshold_source: fixed
    boundary: "notnull: any null in OHLCV for a non-suspended row fails"
    description: "Critical fields must not be null for non-suspended rows"

  - id: C13
    name: required_non_null
    severity: HARD
    type: custom_check
    function: "checks.custom_checks.check_required_non_null"
    params: {}
    applicability: [reference]
    threshold: "schema non-nullable columns have zero nulls"
    threshold_source: fixed
    boundary: "notnull: any missing required column or null value fails"
    description: "Required schema columns must not contain nulls"

  - id: C11
    name: row_count_vs_prev_day
    severity: SOFT
    type: custom_check
    function: "checks.custom_checks.row_count_vs_prev_day"
    params:
      min_ratio: 0.9
      max_ratio: 1.1
    applicability: [daily]
    threshold: "today row count / prev row count in [0.9, 1.1]"
    threshold_source: statistical
    boundary: "inclusive [0.9, 1.1]: ratio outside [0.9, 1.1] flags batch"
    description: "Cross-day row count ratio vs previous trading day"

  - id: C12
    name: ticker_set_drift
    severity: SOFT
    type: custom_check
    function: "checks.custom_checks.ticker_set_drift"
    params:
      max_new_rate: 0.05
      max_drop_rate: 0.02
    applicability: [daily]
    threshold: "new ticker rate <= 5% AND dropped ticker rate <= 2%"
    threshold_source: statistical
    boundary: "le: new_rate > 0.05 or drop_rate > 0.02 flags batch"
    description: "Cross-day ticker set drift vs previous trading day"

  # ---- Legality ----
  - id: L01
    name: price_positive
    severity: HARD
    type: column_check
    columns: [open, high, low, close]
    condition: "gt"
    value: 0
    applicability: [daily, minute]
    threshold: "non-suspended OHLC > 0"
    threshold_source: fixed
    boundary: "gt 0: strictly greater than; 0 FAILS, 0.001 PASSES"
    description: "Prices must be positive for non-suspended rows"

  - id: L02
    name: volume_non_negative
    severity: HARD
    type: column_check
    columns: [volume, amount]
    condition: "ge"
    value: 0
    applicability: [daily, minute]
    threshold: "volume, amount >= 0"
    threshold_source: fixed
    boundary: "ge 0: greater than or equal; 0 PASSES, -1 FAILS"
    description: "Volume and amount must be non-negative"

  - id: L14
    name: date_format
    severity: HARD
    type: column_check
    columns: [trade_date]
    condition: "date_format"
    value: "ISO8601"
    applicability: [daily, minute, fund, factor, reference]
    threshold: "ISO 8601 date format"
    threshold_source: fixed
    boundary: "valid ISO 8601 date: non-parseable dates fail"
    description: "Date format must be ISO 8601"

  - id: L21
    name: index_ticker_format
    severity: HARD
    type: column_check
    columns: [ticker]
    condition: "regex"
    value: "^[A-Za-z0-9_]+\\.(SH|SZ|BJ|CSI|CNI|SI|CI|TI|DC|TS)$"
    applicability: [daily]
    threshold: "regex ^[A-Za-z0-9_]+\\.(SH|SZ|BJ|CSI|CNI|SI|CI|TI|DC|TS)$"
    threshold_source: fixed
    boundary: "full regex match: non-index ticker format fails"
    description: "Index ticker format validation"

  - id: L22
    name: ohlc_relation_soft
    severity: SOFT
    type: custom_check
    function: "checks.custom_checks.check_ohlc_relation"
    params:
      tolerance: 0.0
    applicability: [daily]
    threshold: "strict low <= open,close <= high (soft warning for closing-auction index artifacts)"
    threshold_source: statistical
    boundary: "inclusive: strict OHLC violation triggers soft warning"
    description: "Soft strict OHLC relation check for index bars"

  - id: L23
    name: ohlc_relation_rel_tol
    severity: HARD
    type: custom_check
    function: "checks.custom_checks.check_ohlc_relation_rel_tol"
    params:
      max_rel_gap: 0.01
    applicability: [daily]
    threshold: "low <= high AND OHLC relative overshoot <= 1%"
    threshold_source: fixed
    boundary: "le 0.01: low > high or overshoot > 1% fails"
    description: "Index OHLC relation with 1% relative tolerance"

  # ---- Consistency ----
  - id: K02
    name: volume_amount_match
    severity: HARD
    type: custom_check
    function: "checks.custom_checks.check_volume_amount_match"
    params: {}
    applicability: [daily, minute]
    threshold: "volume > 0 iff amount > 0"
    threshold_source: fixed
    boundary: "bidirectional: both zero or both positive; one zero + one positive fails"
    description: "Volume and amount must both be zero or both be positive"

  - id: K12
    name: value_distribution_shift
    severity: SOFT
    type: custom_check
    function: "checks.custom_checks.value_distribution_shift"
    params:
      col: "close"
      max_mean_shift: 0.10
    applicability: [daily]
    threshold: "mean(close) shift vs previous day <= 10%"
    threshold_source: statistical
    boundary: "le 0.10: relative shift > 0.10 flags batch"
    description: "Cross-day value distribution mean shift vs previous day"

  # ---- Timeliness ----
  - id: T01
    name: daily_freshness
    severity: HARD
    type: custom_check
    function: "checks.custom_checks.check_daily_freshness"
    params:
      max_stale_days: 1
    applicability: [daily, fund]
    threshold: "latest trade_date within 1 trading day of now"
    threshold_source: fixed
    boundary: "le 1: exactly 1 trading day stale passes, 2 fails"
    description: "Daily data freshness"

  - id: T03
    name: no_future_dates
    severity: HARD
    type: custom_check
    function: "checks.custom_checks.check_no_future_dates"
    params: {}
    applicability: [daily, minute, fund, factor, reference]
    threshold: "all trade_date <= today"
    threshold_source: fixed
    boundary: "le today: today PASSES, any future date FAILS"
    description: "No future dates"

  - id: T04
    name: date_ascending
    severity: HARD
    type: custom_check
    function: "checks.custom_checks.check_date_ascending"
    params: {}
    applicability: [daily, minute, fund]
    threshold: "strictly ascending with no duplicates within partition"
    threshold_source: fixed
    boundary: "strictly increasing: equal consecutive dates (duplicates) FAIL"
    description: "Dates must be strictly ascending with no duplicates"

  - id: T09
    name: late_correction
    severity: SOFT
    type: custom_check
    function: "checks.custom_checks.check_late_correction"
    params:
      max_change_rate: 0.0001
    applicability: [daily, fund]
    threshold: "historical change > 0.01% triggers alert"
    threshold_source: statistical
    boundary: "gt 0.0001: change rate at exactly 0.01% does NOT trigger, above triggers"
    description: "Late correction detection for historical data"
