# =============================================================
# 量化平台全局配置
# 架构规范：docs/design/core/config.md
# =============================================================

[project]
# 开启调试模式，输出堆栈信息
debug = true
log_level = "INFO"

[paths]
# 统一数据根目录通过环境变量 QUANT_DATA_ROOT 配置（见 config/.env）
# 以下为相对于 QUANT_DATA_ROOT 的标准子目录约定
asset_dir = "asset"
factors_dir = "factors"
signals_dir = "signals"
models_dir = "models"
logs_dir = "logs"

[data]
# DuckDB 持久化 catalog 文件名（位于 QUANT_DATA_ROOT 下）
catalog_file = "catalog.duckdb"
# 多源仲裁与质量容差配置
source_priority_config = "config/source_priority.yaml"
# 敏感 Token（如 TUSHARE_TOKEN、STRIGHT_FLUSH_TOKEN）严禁明文写入此文件
# 请在 config/.env 文件中配置

[execution]
# 运行模式：sim（模拟/回测） | qmt（实盘）
mode = "sim"
# 撮合价格基准：t1_open（次日开盘价，验收门禁口径） | decision_close（当日收盘价，对拍参考）
fill_basis = "t1_open"
# 默认初始资金：100 万
initial_cash = 1000000.0

[execution.cost]
# A 股标准交易费率（对齐 execution/fee_model.py）
commission_rate   = 0.00025  # 双边佣金率：万 2.5
min_commission    = 5.0      # 单笔最低佣金：5 元
stamp_tax_rate    = 0.0005   # 印花税：卖出单边万 5（场内基金/ETF 豁免）
transfer_fee_rate = 0.00001  # 过户费：双边万 0.1
slippage_rate     = 0.001    # 滑点估算：双边千 1（0.1%）

[ops]
# 调度与运行记录（APScheduler）
timezone = "Asia/Shanghai"
jobs_log = "logs/runs/jobs.jsonl"
metrics_log = "logs/ops/metrics.jsonl"
risk_audit_log = "logs/audit/risk_audit.jsonl"
