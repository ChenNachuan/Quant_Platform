# DQC 规则阈值与升级比例集中配置（与 data/dqc/rules/*.yaml 规则结构解耦）。
# 引擎加载 rules/*.yaml 后按 rule id 合并本文件中的 value / params / escalation_threshold；
# 若某规则未在本文件配置，则回退使用对应规则 YAML 中的默认内联参数。

thresholds:
  # ---- Completeness C01-C12 ----
  C01:
    params:
      comparison: "eq"
    escalation_threshold: 0.0
  C02:
    params:
      min_ratio: 0.95
  C03:
    params:
      expected_bars: 240
    escalation_threshold: 0.05
  C04:
    value: null
    escalation_threshold: 0.20
  C05:
    params:
      max_null_rate: 0.01
      columns: [amount, adjfactor, turnover, pe_ttm, pe_lyr, pb, ps_ttm]
  C06:
    params:
      max_missing_rate: 0.0
    escalation_threshold: 0.05
  C07:
    params:
      forward_days: 30
    escalation_threshold: 0.0
  C08:
    params:
      window: 252
      max_missing: 2
  C09:
    params:
      min_ratio: 0.90
  C10:
    params:
      min_ratio: 1.0
    escalation_threshold: 0.0
  C11:
    params:
      min_ratio: 0.9
      max_ratio: 1.1
  C12:
    params:
      max_new_rate: 0.05
      max_drop_rate: 0.02

  # ---- Legality L01-L14 ----
  L01:
    value: 0
    escalation_threshold: 0.01
  L02:
    value: 0
    escalation_threshold: 0.01
  L03:
    params:
      tolerance: 0.0
    escalation_threshold: 0.01
  L04:
    params:
      main_limit: 0.10
      chinext_star_limit: 0.20
      ipo_first_5d_limit: 0.30
      tolerance: 0.005
  L05:
    params:
      tolerance: 0.005
      contract_specs: null
  L06:
    value: 0
    escalation_threshold: 0.01
  L07:
    value:
      adjfactor: [0.01, 1000]
  L08:
    value: null
    escalation_threshold: 0.01
  L09:
    value:
      pe_ttm: [-10000, 10000]
      pe_lyr: [-10000, 10000]
      pb: [-1000, 1000]
  L10:
    value: 0
    escalation_threshold: 0.05
  L11:
    value: null
    escalation_threshold: 0.05
  L12:
    params:
      max_nan_rate: 0.10
  L13:
    value: "^([036]\\d{5}\\.(SH|SZ)|(43|83|87|92)\\d{4}\\.BJ)$"
    escalation_threshold: 0.01
  L14:
    value: "ISO8601"
    escalation_threshold: 0.01

  # ---- Consistency K01-K12 ----
  K01:
    params:
      max_gap: 0.10
      ca_dates: null
  K02:
    params: {}
    escalation_threshold: 0.05
  K03:
    params: {}
    escalation_threshold: 0.05
  K04:
    params:
      tolerance: 0.01
  K05:
    params:
      ca_dates: null
    escalation_threshold: 0.01
  K06:
    params:
      tolerance: 0.01
    escalation_threshold: 0.10
  K07:
    params:
      max_rel_diff: 0.001
    escalation_threshold: 0.10
  K08:
    params: {}
    escalation_threshold: 0.10
  K09:
    params:
      min_std: 1.0e-8
      max_abs_mean: 100
  K10:
    params: {}
    escalation_threshold: 0.0
  K11:
    params:
      max_diff: 5
  K12:
    params:
      col: close
      max_mean_shift: 0.10

  # ---- Timeliness T01-T09 ----
  T01:
    params:
      max_stale_days: 1
    escalation_threshold: 0.0
  T02:
    params:
      max_stale_days: 1
    escalation_threshold: 0.0
  T03:
    params: {}
    escalation_threshold: 0.0
  T04:
    params: {}
  T05:
    params: {}
  T06:
    params: {}
  T07:
    params:
      max_lag_days: 2
  T08:
    params:
      min_forward_days: 30
  T09:
    params:
      max_change_rate: 0.0001
