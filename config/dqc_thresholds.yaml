# DQC 规则阈值与升级比例集中配置（与 data/dqc/rules/*.yaml 规则结构解耦）。
# 引擎加载 rules/*.yaml 后按 rule id 合并本文件中的 value / params / escalation_threshold；
# 若某规则未在本文件配置，则回退使用对应规则 YAML 中的默认内联参数。

thresholds:
  # ---- Completeness C01-C15 ----
  C01:
    params:
      comparison: "eq"
    escalation_threshold: 0.0
  C02:
    params:
      min_ratio: 0.95
  C03:
    params:
      expected_bars: [240, 241]
    escalation_threshold: 0.05
  C04:
    value: null
    escalation_threshold: 0.20
  C05:
    params:
      max_null_rate: 0.01
      columns: [amount, adjfactor, pe_ttm, pe_lyr, pb, ps_ttm]
  C06:
    params:
      max_missing_rate: 0.0
    escalation_threshold: 0.05
  C07:
    params:
      forward_days: 30
    escalation_threshold: 0.0
  C08:
    params:
      window: 252
      max_missing: 2
  C09:
    params:
      min_ratio: 0.90
  C10:
    params:
      min_ratio: 1.0
    escalation_threshold: 0.0
  C11:
    params:
      min_ratio: 0.9
      max_ratio: 1.1
  C12:
    params:
      max_new_rate: 0.05
      max_drop_rate: 0.02
  C13:
    params: {}
    escalation_threshold: 0.01
  C14:
    params:
      max_null_rate: 0.01
      columns: [pre_close, up_limit, down_limit, limit_pct]
  C15:
    params:
      max_gap_days: 12
    escalation_threshold: 0.0

  # ---- Legality L01-L27 ----
  L01:
    value: 0
    escalation_threshold: 0.01
  L02:
    value: 0
    escalation_threshold: 0.01
  L03:
    params:
      tolerance: 0.0
    escalation_threshold: 0.01
  L04:
    params:
      main_limit: 0.10
      chinext_star_limit: 0.20
      ipo_first_5d_limit: 0.30
      tolerance: 0.005
  L05:
    params:
      tolerance: 0.005
      contract_specs: null
  L06:
    value: 0
    escalation_threshold: 0.01
  L07:
    value:
      adjfactor: [0.01, 1000]
  L08:
    value: null
    escalation_threshold: 0.01
  L09:
    value:
      pe_ttm: [-10000, 10000]
      pe_lyr: [-10000, 10000]
      pb: [-1000, 1000]
  L10:
    value: 0
    escalation_threshold: 0.05
  L11:
    value: null
    escalation_threshold: 0.05
  L12:
    params:
      max_nan_rate: 0.10
  L13:
    value: "^([036]\\d{5}\\.(SH|SZ)|(43|83|87|92)\\d{4}\\.BJ)$"
    escalation_threshold: 0.01
  L14:
    value: "ISO8601"
    escalation_threshold: 0.01
  L15:
    params: {}
    escalation_threshold: 0.01
  L16:
    params: {}
    escalation_threshold: 0.01
  L17:
    value: "^((60|68|50|51|52|53|55|56|58)\\d{4}\\.SH|(00|30|15|16)\\d{4}\\.SZ|(43|83|87|92)\\d{4}\\.BJ)$"
    escalation_threshold: 0.01
  L18:
    params: {}
    escalation_threshold: 0.01
  L19:
    value: "^(5[123568]\\d{4}\\.SH|15\\d{4}\\.SZ)$"
    escalation_threshold: 0.01
  L20:
    params:
      main_limit: 0.10
      chinext_star_limit: 0.20
      tolerance: 0.005
  L21:
    value: "^[A-Za-z0-9_]+\\.(SH|SZ|BJ|CSI|CNI|SI|CI|TI|DC|TS)$"
    escalation_threshold: 0.01
  L22:
    params:
      tolerance: 0.0
  L23:
    params:
      max_rel_gap: 0.01
    escalation_threshold: 0.01
  L24:
    value: "^[A-Z]{1,2}\\d{4}\\.(CFFEX|SHFE|DCE|CZCE|INE|GFEX)$"
    escalation_threshold: 0.01
  L25:
    params:
      positive_cols: [settle]
      non_negative_cols: [open_interest]
    escalation_threshold: 0.01
  L26:
    params: {}
    escalation_threshold: 0.01
  L27:
    value: null
    escalation_threshold: 0.01

  # ---- Consistency K01-K15 ----
  K01:
    params:
      max_gap: 0.10
      ca_dates: null
  K02:
    params: {}
    escalation_threshold: 0.05
  K03:
    params: {}
    escalation_threshold: 0.05
  K04:
    params:
      tolerance: 0.01
  K05:
    params:
      ca_dates: null
    escalation_threshold: 0.01
  K06:
    params:
      tolerance: 0.01
    escalation_threshold: 0.10
  K07:
    params:
      max_rel_diff: 0.001
    escalation_threshold: 0.10
  K08:
    params: {}
    escalation_threshold: 0.10
  K09:
    params:
      min_std: 1.0e-8
      max_abs_mean: 100
  K10:
    params: {}
    escalation_threshold: 0.0
  K11:
    params:
      max_diff: 5
  K12:
    params:
      col: close
      max_mean_shift: 0.10
  K13:
    params: {}
    escalation_threshold: 0.0
  K14:
    params:
      start_col: list_date
      end_col: delist_date
    escalation_threshold: 0.01
  K15:
    params: {}
    escalation_threshold: 0.01

  # ---- Timeliness T01-T12 ----
  T01:
    params:
      max_stale_days: 1
    escalation_threshold: 0.0
  T02:
    params:
      max_stale_days: 1
    escalation_threshold: 0.0
  T03:
    params: {}
    escalation_threshold: 0.0
  T04:
    params: {}
  T05:
    params: {}
  T06:
    params: {}
  T07:
    params:
      max_lag_days: 2
  T08:
    params:
      min_forward_days: 30
  T09:
    params:
      max_change_rate: 0.0001
  T10:
    params:
      column: list_date
    escalation_threshold: 0.0
  T11:
    params:
      column: ex_date
  T12:
    params: {}
