# Source arbitration table (QUANT-40, S10-T1; expanded for 51 asset/ tables).
# Spec: docs/design/data/ingestion.md + docs/design/data/storage_schema.md.
#
# One entry per canonical asset table: priority[0] is the primary source (the
# only one that writes the asset layer); the rest are backups that cross-check
# and backfill gaps, never mix-write.  field_override names the source a field
# is always taken from, regardless of row priority, and must appear in that
# table's priority list.  Switching a primary is a reviewed commit here.
#
# Active source adapters (data/adapters/__init__.py):
#   tushare | qdc | amazingdata | straightflush
# (akshare remains registered only for legacy tests/fallback, retired from
#  default priority lists.)

# ---------------------------------------------------------------------------
# 1. Calendar (1)
# ---------------------------------------------------------------------------
cn_calendar:
  priority: [tushare, qdc, straightflush, amazingdata]

# ---------------------------------------------------------------------------
# 2. A-share Stock Core & Status (6)
# ---------------------------------------------------------------------------
cn_stock_basic:
  priority: [tushare, amazingdata, straightflush]

cn_stock_bars_daily:
  priority: [tushare, qdc, amazingdata, straightflush]
  field_override:
    adjfactor: tushare      # adjfactor baseline & split precision from tushare

cn_stock_bars_minute:
  priority: [qdc, tushare, amazingdata]

cn_stock_fundamental:
  priority: [tushare, qdc, straightflush]
  field_override:
    pe_ttm: tushare         # tushare's PE_TTM definition is the reference

cn_stock_daily_status:
