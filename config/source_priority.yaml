# ---------------------------------------------------------------------------
# Cross-check tolerance per field class (§41.3).  price and adjfactor are
# absolute; volume, amount, pe_pb and default are relative.  Field -> class
# mapping lives in data/ingestion.py (TOLERANCE_CLASS).
# ---------------------------------------------------------------------------
cross_check:
  tolerances:
    price: 0.01
    volume: 0.001
    amount: 0.001
    adjfactor: 1.0e-6
    pe_pb: 0.02
    default: 0.001
