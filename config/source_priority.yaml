# 多数据源仲裁配置表（覆盖 51 张规范资产表，设计见 docs/design/data/ingestion.md 与 storage_schema.md）。
# 各数据源能力边界与已知口径差异见 config/source_capabilities.yaml。
#
# 全局默认优先级：straightflush -> qdc -> amazingdata；
# 例外规则：需无前视偏差日频历史但 SF 仅提供最新快照的域（如 cn_stock_fundamental），以 qdc 为主源、实时字段用 field_override 取 SF。
# tushare 因频次与积分阶梯限制，原则上作末位校验/兜底源（静/低频小表及 2000 分 daily_basic 等待 TushareAdapter 扩展完成后接入）。
# priority[0] 为唯一写入资产层的主数据源，其余仅用于交叉校验与缺口回补（严禁混写）；
# field_override 指定单字段强制数据源（须在对应表的 priority 列表中）；切换主源须经提交评审。
#
# 当前活跃适配器（data/adapters/__init__.py）：straightflush | qdc | amazingdata | tushare
# （akshare 仅保留用于历史测试与兜底，已退出默认优先级列表）

# --- 1. 交易日历 (1) ---
cn_calendar:
  priority: [straightflush, qdc, amazingdata]  # TODO(TushareAdapter): 接入 trade_cal 后可追加 tushare 作校验源

# --- 2. A 股基础信息与行情状态 (6) ---
cn_stock_basic:
  priority: [straightflush, amazingdata, tushare]  # QDC 无独立全市场基础表；TODO(TushareAdapter): 接入 stock_basic 补充 market/list_status/is_hs

cn_stock_bars_daily:
  priority: [straightflush, qdc, amazingdata]  # TODO(TushareAdapter): stock 适配器已就绪（含 adj_factor/suspend_d）；因 should_cross_check 要求全部备源到达，暂不列入默认列表，可按需显式指定 --source tushare 校验
  field_override:
    adjfactor: qdc          # QDC cn_adj_factor 覆盖全历史且无限频（Tushare adj_factor 限 1次/小时，仅适合作单日校验）

cn_stock_bars_minute:
  priority: [qdc, amazingdata]  # TODO(StraightFlushAdapter/QdcAdapter): 接入 SF Market Dumps 与 QDC stocks_1m 后评估追加 straightflush 作第三校验源

cn_stock_fundamental:
  priority: [qdc, straightflush]  # QDC cn_valuation_1d 提供完整日频历史估值（避免 SF 快照前视偏差）；TODO(TushareAdapter): 接入 daily_basic 后追加 tushare 作第三校验源（注意 total_mv/circ_mv 万元->元）
  field_override:
    total_market_cap: straightflush  # SF 实时盘面总市值更准（QDC 盘后才入库）
    float_market_cap: straightflush

cn_stock_daily_status:
  priority: [qdc, amazingdata]

cn_stock_corporate_actions:
  priority: [straightflush, qdc, amazingdata]

# --- 3. 股票指数 / 行业 / 概念 (4) ---
cn_stock_index_basic:
  priority: [straightflush, qdc, amazingdata]

cn_stock_index_bars_daily:
  priority: [straightflush, qdc, amazingdata]  # 注：实测 QDC 与 SF 在 399001/399006 同为全市场量额且 QDC 缺 .BJ 指数与盘后时效，暂维持 SF 主源；TODO(TushareAdapter): 接入 index_daily 后用于三源多数投票仲裁 AD 成份股口径差异

cn_stock_industry:
  priority: [straightflush, qdc, amazingdata]

cn_stock_index_weights:
  priority: [qdc, amazingdata]

# --- 4. 个股基本面 PIT 财务数据 (7) ---
cn_stock_fundamental_income:
  priority: [straightflush, qdc, amazingdata]

cn_stock_fundamental_balance:
  priority: [straightflush, qdc, amazingdata]

cn_stock_fundamental_cashflow:
  priority: [straightflush, qdc, amazingdata]

cn_stock_fundamental_indicator:
  priority: [straightflush, qdc]

cn_stock_fundamental_segment:
  priority: [qdc]

cn_stock_fundamental_earnings:
  priority: [qdc, amazingdata]

cn_stock_fundamental_consensus:
  priority: [qdc]           # QDC cn_estimates 提供 PIT 日频一致预期

# --- 5. 资金流 / 情绪 / 筹码特征 (9) ---
cn_stock_auction:
  priority: [straightflush, qdc]

cn_stock_moneyflow:
  priority: [qdc]

cn_stock_hsgt_market_flow:
  priority: [qdc]

cn_stock_hsgt_hold:
  priority: [qdc]

cn_stock_margin:
  priority: [qdc, amazingdata]

cn_stock_lhb:
  priority: [straightflush, qdc, amazingdata]  # 确认 SF 主源（营业部明细覆盖完整）

cn_stock_lhb_seats:
  priority: [straightflush, qdc, amazingdata]  # QDC 仅 2024+ 覆盖 seat_detail，保持 SF 主源

cn_stock_limit_pool:
  priority: [straightflush, qdc]

cn_stock_chips_perf:
  priority: [qdc]

# --- 6. 股东与股本变动拆分表 (8) ---
cn_stock_holder_num:
  priority: [qdc, amazingdata]

cn_stock_top_holders:
  priority: [qdc, amazingdata]

cn_stock_restricted_release:
  priority: [qdc, amazingdata]

cn_stock_block_trade:
  priority: [qdc, amazingdata]

cn_stock_repurchase:
  priority: [qdc]

cn_stock_holder_trade:
  priority: [qdc]

cn_stock_pledge:
  priority: [qdc, amazingdata]

cn_stock_research_visits:
  priority: [qdc]

# --- 7. 个股 Tick 与 L2 行情 (2) ---
cn_stock_tick:
  priority: [qdc, amazingdata]

cn_stock_tick_l2:
  priority: [qdc, amazingdata]

# --- 8. 独立 ETF 域 (5，不含 cn_etf_pcf) ---
cn_etf_basic:
  priority: [straightflush, amazingdata]

cn_etf_bars_daily:
  priority: [qdc, amazingdata]  # SF 扶摇基金接口仅提供前复权口径且不支持 adjust=none；主源切换为 QDC（不复权）+ AmazingData 交叉校验
  field_override:
    volume: amazingdata   # QDC tdx_mootdx 按整百股截断，成交量以 AD 为准（2012 年无 AD raw 时自动保留 QDC）
    amount: amazingdata   # QDC 早年存在 float32/整数元舍入，成交额以 AD 为准（2012 年无 AD raw 时自动保留 QDC）

cn_etf_bars_minute:
  priority: [qdc, amazingdata]

cn_etf_fundamental:
  priority: [straightflush, qdc, amazingdata]

cn_etf_tick:
  priority: [qdc, amazingdata]

# --- 9. 场外及场内公募基金 (5) ---
cn_fund_basic:
  priority: [straightflush]

cn_fund_managers:
  priority: [straightflush]

cn_fund_nav:
  priority: [straightflush]

cn_fund_dividend:
  priority: [straightflush]

cn_fund_portfolio:
  priority: [straightflush, qdc]

# --- 10. 期货 (4) ---
cn_futures_bars_daily:
  priority: [straightflush, qdc, amazingdata]

cn_futures_tick_l2:
  priority: [qdc, amazingdata]

cn_futures_contract_specs:
  priority: [straightflush, qdc, amazingdata, tushare]  # TODO(TushareAdapter): 接入 fut_basic 后再评估是否提升权重或对 contract_multiplier 做覆写

cn_futures_continuous:
  priority: [straightflush, qdc]

# --- 交叉校验容差（按字段类别，映射定义见 data/ingestion.py 的 TOLERANCE_CLASS）---
# price 与 adjfactor 为绝对容差；volume、amount、pe_pb 与 default 为相对容差。
cross_check:
  tolerances:
    price: 0.01
    volume: 0.001
    amount: 0.001
    adjfactor: 1.0e-6
    pe_pb: 0.02
    default: 0.001
  # 剥离跳过列表（支持通配符）：已知单源独家指数（如 SF .TI 概念指数、899 北交所细分）不参与跨源交叉校验
  skip_tickers:
    cn_stock_index_bars_daily: ["*.TI", "899*.BJ"]
  # 兼容旧后缀配置（与 skip_tickers 自动合并）
  skip_suffixes:
    cn_stock_index_bars_daily: [".TI"]
  # 显式口径豁免：已知跨源统计口径差异字段不计入不一致
  exemptions:
    cn_etf_bars_daily:
      "2022-08-22..2022-08-31":
        "*": [open]           # 仅历史段跳过 open 比对（AD 低成交 ETF open=0.0 缺陷，asset 保留 QDC open）
      "2022-11-09":
        "*": [open]           # 仅该日跳过 open 比对（AD 510370.SH open=0.0 缺陷，asset 保留 QDC open）
    cn_stock_index_bars_daily:
      399001.SZ: [volume, amount]  # 深证成指：SF/QDC 全市场口径 vs AD 成份股口径
      399002.SZ: [volume, amount]  # 深成指R：全市场口径 vs 成份股口径
      399003.SZ: [volume, amount]  # 成份B指：全市场口径 vs 成份股口径
      399006.SZ: [volume, amount]  # 创业板指：SF/QDC 全市场口径 vs AD 成份股口径
      399289.SZ: [volume, amount]  # 深证相关全市场口径指数
      000012.SH: [volume, amount]  # 上证国债指数：手/张口径及成交额口径差异
      000022.SH: [volume, amount]  # 上证公司债指数：手/张口径及成交额口径差异
      000061.SH: [volume, amount]  # 上证沪企债30：手/张口径及成交额口径差异
      000101.SH: [volume, amount]  # 上证信用债100：手/张口径及成交额口径差异
      000116.SH: [volume, amount]  # 上证信用债指数：手/张口径及成交额口径差异
      399298.SZ: [volume, amount]  # 深证债券指数：AD vs SF 量额口径差异
      399299.SZ: [volume, amount]  # 深证债券指数：AD vs SF 量额口径差异
      399301.SZ: [volume, amount]  # 深证债券指数：AD vs SF 量额口径差异
      399302.SZ: [volume, amount]  # 深证债券指数：AD vs SF 量额口径差异
      399481.SZ: [volume, amount]  # 国证企债指数：AD vs SF 量额口径差异
      000170.SH: [close, high, low, volume, amount]  # 跨境指数：交易日历/汇率/收盘时间差异
      000867.SH: [close, high, low, volume, amount]  # 跨境指数
      000869.SH: [close, high, low, volume, amount]  # 跨境指数
  # 按资产子类分级容差（按 YAML 顺序匹配，bond/cross_border 先于 equity 兜底）
  tolerance_overrides:
    cn_stock_index_bars_daily:
      bond:
        tickers: ["000012.SH", "000013.SH", "000022.SH", "000061.SH", "000101.SH", "000116.SH", "399298.SZ", "399299.SZ", "399301.SZ", "399302.SZ", "399481.SZ"]
        price: 0.20
        volume: 0.05
        amount: 0.05
      cross_border:
        tickers: ["000170.SH", "000867.SH", "000869.SH"]
        prefixes: ["HSI", "HSCEI", "HSTECH", "SPX", "NDX"]
        price: 0.50
        volume: 0.02
        amount: 0.02
      equity:
        prefixes: ["000", "399", "899", "93", "97", "98", "47", "48"]
        price: 0.05
        volume: 0.005
        amount: 0.005
